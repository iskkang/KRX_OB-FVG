name: KRX OB+FVG Daily Scanner

on:
  schedule:
    # UTC 06:40 = KST 15:40 (장 마감 후)
    - cron: '40 6 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scanner
      env:
        # GitHub Settings > Secrets 에 등록된 값들을 불러옵니다.
        KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
        KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
        KIWOOM_ACCOUNT: ${{ secrets.KIWOOM_ACCOUNT }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py
